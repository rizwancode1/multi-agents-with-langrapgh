[project]
name = "multi-agents"
version = "0.1.0"
description = "Full-stack AI customer-support platform: LangGraph multi-agent orchestration (FastAPI) with agentic hybrid RAG, plus a Next.js support-desk frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "langchain-anthropic>=1.3.3",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.8",
    "langsmith>=0.7.4",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "uvicorn>=0.41.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2",
    "pypdf>=4.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "sqlalchemy>=2.0.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langgraph-checkpoint>=4.2.0",
    "aiosqlite>=0.21.0",
    "redis>=5.0",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit selection so lint results don't shift when the default rule set
# changes across ruff versions.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # long lines: LLM prompts / structured logs read better unwrapped
    "B008",  # function call in argument defaults — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets env vars before app imports on purpose.
"tests/**" = ["E402"]
